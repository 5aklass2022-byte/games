<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Life Is a Sport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one column. A home path of eight stages; each stage opens as a screen with learn blocks first, then scored practice cards. Colour tabs echo the textbook (green, blue, pink). */
:root{
  --bg:#f1f7f6; --surface:#ffffff; --ink:#12303a; --muted:#4a666e; --line:#cfe0de;
  --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --green:#cfeedd; --blue:#d3e9f7; --pink:#fbd9d9;
  --sun:#e9a23b; --good:#1d8a50; --good-soft:#d9f2e3; --bad:#c0392f; --bad-soft:#fbe0dd;
  --display:'Comfortaa','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b20; --surface:#16282f; --ink:#e5f0ef; --muted:#9fb8bc; --line:#2a444c;
    --accent:#52c4cf; --accent-ink:#06282d; --accent-soft:#17383e;
    --green:#1c3d30; --blue:#1b3a4d; --pink:#442a2e;
    --sun:#f3b55a; --good:#58c68a; --good-soft:#173a2a; --bad:#f08a80; --bad-soft:#442523;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b20; --surface:#16282f; --ink:#e5f0ef; --muted:#9fb8bc; --line:#2a444c;
  --accent:#52c4cf; --accent-ink:#06282d; --accent-soft:#17383e;
  --green:#1c3d30; --blue:#1b3a4d; --pink:#442a2e;
  --sun:#f3b55a; --good:#58c68a; --good-soft:#173a2a; --bad:#f08a80; --bad-soft:#442523;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin:10px 0 14px}
.tabs i{display:block;height:10px;border-radius:3px}
.tabs i:nth-child(1){width:64px;background:var(--green)}
.tabs i:nth-child(2){width:34px;background:var(--blue)}
.tabs i:nth-child(3){width:34px;background:var(--pink)}
.kicker{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xp{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.xp svg{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:800;text-decoration:none}

/* home path */
.lead{color:var(--muted);max-width:60ch;margin:6px 0 18px}
.path{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:12px}
.path::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:4px;border-radius:2px;background:var(--line)}
.path li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;position:relative}
.node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface);border:3px solid var(--line);color:var(--muted);z-index:1}
.node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stagebtn{text-decoration:none;color:inherit;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stagebtn:hover{border-color:var(--accent)}
.stagebtn .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stagebtn h3{margin-bottom:2px}
.stagebtn .sub{color:var(--muted);font-size:.93rem}
.stagebtn .ref{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:6px;color:var(--ink)}
.t-green{background:var(--green)} .t-blue{background:var(--blue)} .t-pink{background:var(--pink)}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.star-on{fill:var(--sun)} .star-off{fill:none;stroke:var(--line);stroke-width:1.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;min-width:0}
.card > h2,.card > h3{margin-bottom:8px}
.note{color:var(--muted);font-size:.93rem}
.stagehead{display:flex;gap:12px;align-items:center;margin:4px 0 4px}
.stagehead .tag{flex:none;width:12px;align-self:stretch;border-radius:6px}
.status{margin-top:10px;font-weight:800;color:var(--muted)}
.status.ok{color:var(--good)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:800}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
.chip{background:var(--accent-soft);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:6px 13px;font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.listen{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.8rem;font-weight:800;color:var(--accent)}

/* vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.vc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:4px;align-content:start;min-width:0}
.vc .en{font-family:var(--display);font-weight:700;font-size:1.1rem}
.vc .ipa{color:var(--muted);font-size:.9rem}
.tr{display:flex;gap:8px;align-items:baseline}
.lang{flex:none;font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--blue);color:var(--ink)}
.lang.ru{background:var(--pink)}
.vc .eg{font-size:.9rem;color:var(--muted);font-style:italic}
.vc.cover .tr span:last-child{filter:blur(7px);cursor:pointer;user-select:none}
.vc.cover.shown .tr span:last-child{filter:none}
.grouphead{margin-top:18px;display:flex;align-items:center;gap:8px}
.grouphead i{width:26px;height:8px;border-radius:3px;display:block}

/* reading */
.dialogue{display:grid;gap:10px;margin-top:8px}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start}
.who{font-weight:800;font-size:.92rem;padding:2px 8px;border-radius:6px;text-align:center}
.who.leo{background:var(--blue)} .who.helen{background:var(--pink)} .who.tim{background:var(--green)} .who.alex{background:var(--blue)}
.say{font-size:1.04rem}
.w{border-bottom:2px dotted var(--accent);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;color:inherit}
.w.new{background:var(--accent-soft);border-bottom-style:solid;border-radius:3px}
.gloss{position:sticky;bottom:10px;margin-top:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:grid;gap:2px;z-index:3}
.gloss b{font-family:var(--display)}
.textpanel{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.panelfig{width:100%;display:block}

/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:5px;margin:8px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.intro{color:var(--muted);margin-bottom:8px}
.prompt{font-size:1.1rem;font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.answers{display:grid;gap:8px}
.answers.bank{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fill{color:var(--good);border-bottom:3px solid var(--good)}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--muted);text-align:center}
.typebox{display:flex;gap:8px;flex-wrap:wrap}
.typebox input,.sentrow input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.typebox input{flex:1 1 180px}
.typebox input:focus,.sentrow input:focus,textarea:focus{border-color:var(--accent);outline:none}
.fb{min-height:1.5em;margin-top:12px}
.fb .ok{color:var(--good);font-weight:800}
.fb .no{color:var(--bad);font-weight:800}
.nav{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:8px 0}
.result .stars svg{width:38px;height:38px}
.big{font-family:var(--display);font-size:1.5rem;font-weight:700}

/* grammar */
.explain{display:grid;gap:8px}
.lng{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
.scroll{overflow-x:auto;max-width:100%}
.eg-box{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:2px 0}

/* match */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.matchgrid button{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.matchgrid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.matchgrid button.done{border-color:var(--good);background:var(--good-soft);cursor:default}

/* spinner + speaking */
.spin{font-size:1.15rem;font-weight:700;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:14px;margin:10px 0;min-height:4.2em}

/* writing */
.sentrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.sentrow label{font-weight:800}
.sentrow .st{grid-column:2;font-size:.9rem}
.sentrow input{width:100%}
textarea{width:100%;min-height:190px;resize:vertical;line-height:1.5}
.checklist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.checklist li.ok .dot{background:var(--good);border-color:var(--good)}
.checklist li.ok{color:var(--good);font-weight:700}

@media (max-width:520px){
  .line{grid-template-columns:minmax(0,1fr)}
  .line .listen{justify-self:start}
  .who{justify-self:start}
  .sentrow{grid-template-columns:minmax(0,1fr)}
  .sentrow .st{grid-column:1}
  .matchgrid{gap:8px}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
.who.andi{background:var(--blue)} .who.nina{background:var(--pink)}
.bigpic{display:block;font-size:3.4rem;line-height:1.15;margin-bottom:6px}
.vc .vpic{font-size:2.4rem;line-height:1.1}
.mine{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.mine label{font-weight:800;font-size:1.05rem}
.mine input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.mine input:focus{border-color:var(--accent);outline:none}
.mine .st{flex:1 1 100%}
.answers.wordbank{grid-template-columns:repeat(auto-fit,minmax(80px,max-content));gap:10px}
.built{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:1.1rem;font-weight:700;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.built span{background:var(--accent-soft);border-radius:8px;padding:2px 9px}
.built .note{background:none;padding:0;font-weight:400;font-size:.95rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>

function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){return canSay?'<button class="listen" type="button" data-say="'+esc(t)+'" aria-label="Listen">Listen</button>':''}
function rate(c,t){var p=t?c/t:0;return p>=.85?3:p>=.6?2:1}
function starsSVG(n){var s='';for(var i=0;i<3;i++)s+='<svg viewBox="0 0 24 24" aria-hidden="true"><path class="'+(i<n?'star-on':'star-off')+'" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';return '<span class="stars" role="img" aria-label="'+n+' of 3 stars">'+s+'</span>'}
function tri(en,ro,ru){return '<div class="lng"><span class="lang" style="background:var(--green)">EN</span><span>'+en+'</span></div><div class="lng"><span class="lang">RO</span><span>'+ro+'</span></div><div class="lng"><span class="lang ru">RU</span><span>'+ru+'</span></div>'}
function mk(root,cls,html){var d=document.createElement('section');d.className=cls||'card';if(html)d.innerHTML=html;root.appendChild(d);return d}
function copyText(text,btn,host){
 var label=btn.textContent;
 function ok(){btn.textContent='Copied';setTimeout(function(){btn.textContent=label},1600)}
 function fallback(){
  var t=host.querySelector('textarea.copybox');
  if(!t){t=document.createElement('textarea');t.className='copybox';t.readOnly=true;t.style.minHeight='110px';t.style.marginTop='8px';host.appendChild(t)}
  t.value=text;t.focus();t.select();btn.textContent='Select and copy the text below';
 }
 try{navigator.clipboard.writeText(text).then(ok,fallback)}catch(e){fallback()}
}

/* ---------- QUIZ ENGINE ---------- */
function quiz(root,id,title,items,intro){
 var card=mk(root,'card quiz');card.id='q-'+id;
 var list,i,pts,c,tries;
 function start(){list=typeof items==='function'?items():items;i=0;pts=0;c=0;step()}
 function step(){
  if(i>=list.length)return finish();
  var it=list[i];tries=0;
  var opts=it.type?null:(it.fixed?it.opts.slice():shuffle(it.opts));
  var maxT=opts?Math.min(2,opts.length-1):2;
  var acc=(it.acc||[it.a]).map(norm);
  card.innerHTML='<div class="qhead"><h3>'+title+'</h3><span class="count">'+(i+1)+' / '+list.length+'</span></div><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div>'+(intro&&i===0?'<p class="intro">'+intro+'</p>':'')+'<p class="prompt"></p><div class="answers'+(it.blank&&opts&&opts.length>3?' bank':'')+'"></div><div class="fb" role="status" aria-live="polite"></div><div class="nav"></div>';
  var prompt=card.querySelector('.prompt'),ans=card.querySelector('.answers'),fb=card.querySelector('.fb'),nav=card.querySelector('.nav');
  function showQ(f){prompt.innerHTML=it.blank||it.type?it.q.replace('____',f?'<b class="fill">'+f+'</b>':'<span class="blank">&nbsp;</span>'):it.q}
  showQ();
  if(it.say)nav.innerHTML=listenBtn(it.say);
  function lock(){ans.querySelectorAll('button,input').forEach(function(b){b.disabled=true})}
  function award(){var p=tries===0?10:tries===1?5:0;pts+=p;if(tries===0)c++;return p}
  function next(){
   var last=i===list.length-1;
   nav.insertAdjacentHTML('beforeend','<button class="btn" type="button">'+(last?'See my score':'Next')+'</button>');
   var b=nav.querySelector('.btn');b.focus();b.onclick=function(){i++;step()};
  }
  function right(shown){var p=award();showQ(shown);fb.innerHTML='<span class="ok">Correct!'+(p?' +'+p+' XP':'')+'</span> '+(it.ex||'');lock();next()}
  function reveal(){showQ(it.a);fb.innerHTML='<span class="no">Not quite.</span> The answer is <b>'+it.a+'</b>. '+(it.ex||'');lock();
   ans.querySelectorAll('button.opt').forEach(function(b){if(acc.indexOf(norm(b.textContent))>-1)b.classList.add('good')});next()}
  if(opts){
   opts.forEach(function(o){
    var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o;
    b.onclick=function(){
     if(acc.indexOf(norm(o))>-1){b.classList.add('good');right(o)}
     else{b.classList.add('bad','shake');b.disabled=true;tries++;
      if(tries>=maxT)reveal();else fb.innerHTML='<span class="no">Try again.</span> You can still earn 5 XP.'}
    };
    ans.appendChild(b);
   });
  }else{
   ans.className='typebox';
   ans.innerHTML='<input type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Your answer" placeholder="Type the word"><button class="btn" type="button">Check</button>';
   var inp=ans.querySelector('input'),go=ans.querySelector('button');
   function check(){
    var v=norm(inp.value);if(!v)return;
    if(acc.indexOf(v)>-1){right(it.a||it.acc[0])}
    else{tries++;inp.classList.add('shake');
     if(tries>=2){it.a=it.a||it.acc[0];reveal()}
     else{fb.innerHTML='<span class="no">Try again.</span> Hint: '+(it.hint||('it starts with “'+acc[0].charAt(0)+'” and has '+acc[0].length+' letters.'));inp.select()}}
   }
   go.onclick=check;inp.onkeydown=function(e){if(e.key==='Enter')check()};
   inp.focus();
  }
 }
 function finish(){
  var rec=S.q[id];if(!rec||pts>=rec.pts){S.q[id]={pts:pts,c:c,t:list.length};save()}
  card.innerHTML='<div class="result"><h3>'+title+'</h3>'+starsSVG(rate(c,list.length))+'<div class="big">'+c+' of '+list.length+' right the first time</div><p class="note">+'+pts+' XP this round. Best round: '+S.q[id].pts+' XP.</p><button class="btn" type="button">Play again</button></div>';
  card.querySelector('.btn').onclick=start;
  refreshHud();
 }
 start();
}

function matchGame(root,poolArg){
 var card=mk(root,'card');var lang='ro';
 function round(){
  var pool=shuffle(poolArg||CORE).slice(0,6),right=shuffle(pool),sel=null,done=0,first=0,missed={};
  card.innerHTML='<h3>Match the words</h3><p class="note">Tap an English word, then tap its translation. Each first-try match gives 5 XP.</p><div class="row-wrap" style="margin-top:8px"><button class="chip'+(lang==='ro'?' on':'')+'" data-l="ro" type="button">Romanian</button><button class="chip'+(lang==='ru'?' on':'')+'" data-l="ru" type="button">Russian</button></div><div class="matchgrid"></div><div class="fb" role="status" aria-live="polite"></div>';
  var grid=card.querySelector('.matchgrid'),fb=card.querySelector('.fb');
  pool.forEach(function(w,i){
   var l=document.createElement('button');l.type='button';l.textContent=w.en;l.dataset.k=w.en;l.style.gridColumn='1';grid.appendChild(l);
   var r=document.createElement('button');r.type='button';r.textContent=right[i][lang];r.dataset.k=right[i].en;r.style.gridColumn='2';grid.appendChild(r);
   l.dataset.side='l';r.dataset.side='r';
  });
  grid.addEventListener('click',function(e){
   var b=e.target.closest('button');if(!b||b.classList.contains('done'))return;
   if(b.dataset.side==='l'){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
   if(!sel)return;
   if(sel.dataset.k===b.dataset.k){
    sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');
    if(!missed[sel.dataset.k])first++;
    sel=null;done++;
    if(done===6){
     var p=first*5,rec=S.q.match;if(!rec||p>=rec.pts){S.q.match={pts:p,c:first,t:6};save()}
     fb.innerHTML='<div class="result">'+starsSVG(rate(first,6))+'<div class="big">'+first+' of 6 on the first try (+'+p+' XP)</div><button class="btn" type="button" id="again">New round</button></div>';
     fb.querySelector('#again').onclick=round;refreshHud();
    }
   }else{
    missed[sel.dataset.k]=true;b.classList.add('shake');sel.classList.add('shake');
    var s2=sel;setTimeout(function(){b.classList.remove('shake');s2.classList.remove('shake')},350);
    fb.innerHTML='<span class="no">Not that one.</span> Try again.';
   }
  });
  card.querySelectorAll('[data-l]').forEach(function(c){c.onclick=function(){lang=c.dataset.l;round()}});
 }
 round();
}

/* ---------- SENTENCE BUILDER ---------- */
function scramble(root,id,title,list,intro){
 var card=mk(root,'card quiz');card.id='q-'+id;
 var i,pts,c,tries,picks,order,ws,it,finished,msg;
 function start(){i=0;pts=0;c=0;next()}
 function next(){
  if(i>=list.length)return finish();
  it=list[i];tries=0;picks=[];finished=false;msg='';
  ws=it.s.split(' ');
  var idx=ws.map(function(w,k){return k}),g=0;
  order=shuffle(idx);while(order.join()===idx.join()&&g++<10)order=shuffle(idx);
  render();
 }
 function render(){
  card.innerHTML='<div class="qhead"><h3>'+title+'</h3><span class="count">'+(i+1)+' / '+list.length+'</span></div><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div>'+(i===0&&intro?'<p class="intro">'+intro+'</p>':'')+
   '<span class="bigpic">'+it.pic+'</span><div class="built" aria-live="polite">'+(picks.length?picks.map(function(k){return '<span>'+ws[k]+'</span>'}).join(' '):'<span class="note">Tap the words in the right order. Нажимай слова по порядку.</span>')+'</div>'+
   '<div class="answers wordbank">'+order.map(function(k){return '<button type="button" class="opt" data-k="'+k+'"'+(finished||picks.indexOf(k)>-1?' disabled':'')+'>'+ws[k]+'</button>'}).join('')+'</div>'+
   '<div class="fb" role="status" aria-live="polite">'+msg+'</div><div class="tools">'+(finished?'':'<button class="btn ghost small" type="button" data-act="undo">Undo</button> <button class="btn ghost small" type="button" data-act="clear">Clear</button> ')+(canSay?'<button class="listen" type="button" data-say="'+esc(it.s)+'">Listen</button>':'')+'</div><div class="nav"></div>';
  if(finished){
   var nav=card.querySelector('.nav'),last=i===list.length-1;
   nav.innerHTML='<button class="btn" type="button" data-act="next">'+(last?'See my score':'Next')+'</button>';
   nav.querySelector('.btn').focus();
  }
 }
 card.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');
  if(a){
   var act=a.dataset.act;
   if(act==='undo'){picks.pop();msg='';render()}
   else if(act==='clear'){picks=[];msg='';render()}
   else if(act==='next'){i++;next()}
   return;
  }
  var b=e.target.closest('.opt');if(!b||b.disabled||finished)return;
  picks.push(+b.dataset.k);
  if(picks.length<ws.length){render();return}
  var built=picks.map(function(k){return ws[k]}).join(' ');
  if(built===it.s){
   var p=tries===0?10:5;pts+=p;if(tries===0)c++;
   msg='<span class="ok">Correct! +'+p+' points</span>';finished=true;render();
  }else{
   tries++;
   if(tries>=2){msg='<span class="no">Not quite.</span> The sentence is: <b>'+it.s+'</b>';finished=true;picks=ws.map(function(w,k){return k});render()}
   else{picks=[];msg='<span class="no">Try again.</span> You can still earn 5 points.';render()}
  }
 });
 function finish(){
  var rec=S.q[id];if(!rec||pts>=rec.pts){S.q[id]={pts:pts,c:c,t:list.length};save()}
  card.innerHTML='<div class="result"><h3>'+title+'</h3>'+starsSVG(rate(c,list.length))+'<div class="big">'+c+' of '+list.length+' right the first time</div><p class="note">+'+pts+' points this round. Best round: '+S.q[id].pts+'.</p><button class="btn" type="button" id="again">Play again</button></div>';
  card.querySelector('#again').onclick=start;
  refreshHud();
 }
 start();
}

function ppCard(root){
 mk(root,'card','<h2>Grammar: have / has + V3</h2><div class="explain">'+
  tri('We use <b>have / has + past participle (V3)</b> for something that has happened and is important now. Time words: <b>just, never, already</b>.','Folosim <b>have / has + participiul trecut (V3)</b> pentru o acțiune încheiată, dar importantă acum. Cuvinte: <b>just</b> (tocmai), <b>never</b> (niciodată), <b>already</b> (deja).','Используем <b>have / has + третья форма глагола (V3)</b> для действия, которое уже произошло и важно сейчас. Слова: <b>just</b> (только что), <b>never</b> (никогда), <b>already</b> (уже).')+
  '</div><div class="scroll" style="margin-top:12px"><table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>'+
  '<tr><td>+</td><td>They <b>have</b> lost the game.</td><td>Megan <b>has just</b> scored a goal!</td></tr>'+
  '<tr><td>−</td><td>I <b>have never</b> played football.</td><td>She <b>hasn’t</b> participated.</td></tr>'+
  '<tr><td>?</td><td><b>Have</b> you seen Plushenko’s performance?<br>Yes, I <b>have</b>.</td><td><b>Has</b> she participated in the competition?<br>No, she <b>hasn’t</b>.</td></tr>'+
  '<tr><td>Wh-</td><td>What <b>have</b> they done?</td><td>What <b>has</b> happened? Who <b>has</b> won the game?</td></tr></table></div>'+
  '<h3 style="margin-top:14px">Past participles (V3)</h3><div class="scroll"><table><tr><th>Regular: + -ed</th><th>Irregular: learn them</th></tr><tr><td>score → scored<br>happen → happened<br>watch → watched<br>turn → turned<br>miss → missed<br>participate → participated</td><td>win → <b>won</b><br>lose → <b>lost</b><br>see → <b>seen</b><br>do → <b>done</b></td></tr></table></div>');
}
function tagCard(root){
 mk(root,'card','<h2>Grammar: tag questions</h2><div class="explain">'+
  tri('A <b>tag question</b> is a short question at the end of a sentence. <b>Positive statement → negative tag.</b> <b>Negative statement → positive tag.</b> The tag repeats the helping verb (can, have, has) and uses a pronoun.','<b>Tag question</b> = întrebare scurtă la sfârșitul propoziției. <b>Afirmație → tag negativ. Negație → tag pozitiv.</b> Tag-ul repetă verbul auxiliar (can, have, has) și folosește un pronume.','<b>Tag question</b> — короткий вопрос в конце предложения. <b>Утверждение → отрицательный хвостик. Отрицание → положительный хвостик.</b> Хвостик повторяет вспомогательный глагол (can, have, has) и местоимение.')+
  '</div><div class="scroll" style="margin-top:12px"><table><tr><th>Statement</th><th>Tag</th></tr>'+
  [['You can swim,','can’t you?'],['Maria can’t ski,','can she?'],['They have won,','haven’t they?'],['Bob hasn’t seen it,','has he?']].map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b> '+listenBtn(r[0]+' '+r[1])+'</td></tr>'}).join('')+'</table></div>'+
  '<div class="eg-box" style="margin-top:12px"><b>Intonation:</b> voice goes up ↗ when you really ask. Voice goes down ↘ when you are almost sure and want to hear “yes”.<br><span class="note">Intonația urcă când întrebi cu adevărat și coboară când ești aproape sigur · Голос идёт вверх, когда вы действительно спрашиваете, и вниз, когда почти уверены.</span></div>'+
  '<div class="eg-box" style="margin-top:8px">Example: Maria <b>can</b> play the guitar, <b>can’t</b> she?</div>');
}
function talkCard(root){
 mk(root,'card','<h2>Speaking: is football a game for boys only?</h2><div class="explain"><div class="eg-box">I think football is a game for <b>everybody</b> because …</div><div class="eg-box">In my opinion, girls <b>can</b> play football as well as boys because …</div><div class="eg-box">I agree / I don’t agree, because …</div></div>'+
  '<h3 style="margin-top:14px">Exercise 12: describe the picture</h3><div class="explain" style="margin-top:6px"><div class="eg-box">In the picture I can see two players and a ball.</div><div class="eg-box">It is a football game. The players are young.</div><div class="eg-box">Is there anything unusual? One player is a girl.</div><div class="eg-box">In pairs, make up a dialogue before the game: A: Good luck! B: Thanks! You too!</div></div>');
}
function posterCard(root){
 mk(root,'card','<h2>Exercise 13: poster about your hero</h2><div class="explain"><div class="eg-box"><b>1.</b> A big title: <i>My hero: …</i> and a picture.</div><div class="eg-box"><b>2.</b> Three facts with have / has + V3: <i>She has won … He has scored …</i></div><div class="eg-box"><b>3.</b> Two qualities: <i>determination, courage</i>.</div><div class="eg-box"><b>4.</b> A quotation: <i>I’m the first …</i></div><div class="eg-box"><b>Presentation:</b> Hello! My hero is … I admire … because … Thank you for listening!</div></div>');
}
function heroWrite(root){
 var PARTS=[
  {k:'h1',t:'1. Introduction',h:'Who is your hero? What is he or she?',ph:'My hero is … I simply admire … He / She is a …',c:'Starts with “My hero is …”',f:function(v){return words(v)>=5&&/\bmy hero is\b/i.test(v)}},
  {k:'h2',t:'2. What has he or she done?',h:'Use have / has + V3.',ph:'He / She has won … He / She has just …',c:'Uses have / has + a verb (has won, has scored …)',f:function(v){return words(v)>=5&&/\b(has|have)\s+(just |never |already |always )?[a-z]{3,}\b/i.test(v)}},
  {k:'h3',t:'3. Qualities',h:'What qualities do you admire?',ph:'I like his / her … and … He / She never gives up.',c:'Names a quality (courage, determination, kind …)',f:function(v){return words(v)>=5&&/(courage|determination|hard|brave|kind|strong|talent|patient|clever|gives up|give up|confident|honest)/i.test(v)}},
  {k:'h4',t:'4. Conclusion',h:'Why does he or she inspire you?',ph:'He / She inspires me because …',c:'Says why the hero inspires you',f:function(v){return words(v)>=5&&/(inspire|admire|impress|because|example)/i.test(v)}}
 ];
 var card=mk(root,'card','<h2>Exercise 9: write about your hero</h2><p class="note">Use Ana’s text as your example. Write four short parts.</p>'+
  PARTS.map(function(p){return '<div style="margin-top:14px"><h3>'+p.t+'</h3><p class="note">'+p.h+'</p><textarea id="'+p.k+'" aria-label="'+p.t+'" placeholder="'+p.ph+'" style="min-height:84px"></textarea></div>'}).join('')+
  '<ul class="checklist" id="cl"></ul><div class="row-wrap" style="margin-top:12px"><span class="note" id="wc"></span></div><div class="row-wrap" style="margin-top:8px"><button class="btn" type="button" id="sv">Save my result</button><button class="btn ghost" type="button" id="cp">Copy my text</button></div><div class="fb" role="status" aria-live="polite"></div>');
 var fb=card.querySelector('.fb'),cl=card.querySelector('#cl'),wc=card.querySelector('#wc');
 function all(){return PARTS.map(function(p){return card.querySelector('#'+p.k).value}).join(' ')}
 function checks(){
  var r=PARTS.map(function(p){return [p.c,p.f(card.querySelector('#'+p.k).value)]});
  var a=all();
  r.push(['Uses a noun in -er (player, winner, skater, athlete …)',/\b(player|swimmer|runner|skater|skier|dancer|boxer|defender|winner|writer|teacher|singer|gymnast|athlete|driver|actor|footballer)\b/i.test(a)]);
  r.push(['Uses amazing, brilliant, fantastic or perfect',/\b(amazing|brilliant|fantastic|perfect)\b/i.test(a)]);
  r.push(['At least 60 words in total',words(a)>=60]);
  return r;
 }
 function upd(){var r=checks();wc.textContent=words(all())+' words in total';cl.innerHTML=r.map(function(x){return '<li class="'+(x[1]?'ok':'')+'"><span class="dot"></span>'+x[0]+'</li>'}).join('')}
 PARTS.forEach(function(p){var t=card.querySelector('#'+p.k);if(DR[p.k])t.value=DR[p.k];t.oninput=function(){setDraft(p.k,t.value);upd()}});
 upd();
 card.querySelector('#sv').onclick=function(){
  if(words(all())<10){fb.innerHTML='<span class="no">Write at least 10 words first.</span>';return}
  var r=checks(),n=r.filter(function(x){return x[1]}).length,pts=n*5,rec=S.q.wp;
  if(!rec||pts>=rec.pts){S.q.wp={pts:pts,c:n,t:r.length};save()}
  fb.innerHTML='<div class="result">'+starsSVG(rate(n,r.length))+'<div class="big">'+n+' of '+r.length+' checks done (+'+pts+' XP)</div><p class="note">'+(n<r.length?'Read the checklist, add what is missing and save again.':'Excellent text!')+'</p></div>';
  refreshHud();
 };
 card.querySelector('#cp').onclick=function(){copyText(PARTS.map(function(p){return card.querySelector('#'+p.k).value.trim()}).filter(Boolean).join(' '),this,fb)};
}

var cur=0;
function isDone(st){return st.ids.every(function(id){return S.q[id]})}
function stageStats(st){var c=0,t=0;st.ids.forEach(function(id){if(S.q[id]){c+=S.q[id].c;t+=S.q[id].t}});return {c:c,t:t}}
function stageStars(st){var s=stageStats(st);return isDone(st)?rate(s.c,s.t):0}
function xpHTML(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="star-on" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span>'+totalXP()+' XP</span>'}
function refreshHud(){
 var x=document.getElementById('hudxp');if(x)x.innerHTML=xpHTML();
 var s=document.getElementById('status'),a=document.getElementById('after');
 if(cur&&s){
  var st=STAGES[cur-1],n=st.ids.filter(function(id){return S.q[id]}).length;
  if(isDone(st)){s.className='status ok';s.innerHTML='Stage complete '+starsSVG(stageStars(st))}
  else{s.className='status';s.textContent='Practice finished: '+n+' of '+st.ids.length}
  if(a){a.innerHTML=isDone(st)?'<div class="card result"><div class="big">Well done!</div>'+(cur<STAGES.length?'<a class="btn" href="#stage-'+(cur+1)+'" style="text-decoration:none">Next stage</a>':'<a class="btn" href="#" style="text-decoration:none">See all stages</a>')+'</div>':''}
 }
}
function home(){
 var done=STAGES.filter(isDone).length;
 var li=STAGES.map(function(st,i){
  var d=isDone(st);
  return '<li><span class="node'+(d?' done':'')+'">'+(i+1)+'</span><a class="stagebtn" href="#stage-'+(i+1)+'"><div class="row"><div><h3>'+st.title+'</h3><div class="sub">'+st.sub+'</div></div>'+(d?starsSVG(stageStars(st)):'')+'</div><span class="ref t-'+st.tint+'">'+st.ref+'</span></a></li>';
 }).join('');
 app.innerHTML='<div class="top"><span class="kicker">Unit 2 · Lesson Four · pages 31–33</span><span class="xp" id="hudxp">'+xpHTML()+'</span></div><h1>Life Is a Sport</h1><div class="tabs"><i></i><i></i><i></i></div>'+
  '<p class="lead">Learn the new words, read about Simone Biles, talk about what has just happened, add tag questions and write about your own hero. A right answer on the first try gives 10 XP, on the second try 5 XP. You can open any stage and play it again.</p>'+
  '<ol class="path">'+li+'</ol>'+
  '<div class="card"><h3>'+(done===STAGES.length?'Lesson complete!':done+' of '+STAGES.length+' stages complete')+'</h3><p class="note" style="margin:4px 0 10px">Type your name and copy your results to send them to your teacher.</p><div class="row-wrap"><input id="nm" type="text" autocomplete="name" aria-label="Your name" placeholder="Your name" style="font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;flex:1 1 180px"><button class="btn" type="button" id="cr">Copy my results</button><button class="btn ghost" type="button" id="rs">Start over</button></div><div id="rh"></div></div>';
 var nm=document.getElementById('nm');nm.value=S.name||'';nm.oninput=function(){S.name=nm.value;save()};
 var rh=document.getElementById('rh');
 document.getElementById('cr').onclick=function(){
  var t='Life Is a Sport – '+(S.name||'(no name)')+'\nTotal: '+totalXP()+' XP, '+done+' of '+STAGES.length+' stages complete\n'+STAGES.map(function(st,i){var s=stageStats(st);return (i+1)+'. '+st.title+': '+(isDone(st)?stageStars(st)+'/3 stars ('+s.c+'/'+s.t+' first try)':'not finished')}).join('\n');
  copyText(t,this,rh);
 };
 var rs=document.getElementById('rs'),armed=false;
 rs.onclick=function(){

  S={name:S.name,q:{}};DR={};save();try{localStorage.removeItem('uf4-draft')}catch(e){}home();
 };
}
function stageScreen(n){
 var st=STAGES[n-1];
