
name: Update games catalog

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate game catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote

          files = sorted(
              (p for p in Path(".").rglob("*.html")
               if p.name.lower() != "index.html"
               and ".git" not in p.parts),
              key=lambda p: str(p).lower()
          )

          cards = []
          for p in files:
              title = p.stem.replace("_", " ")
              url = "/".join(quote(part) for part in p.parts)
              cards.append(
                  f'<a class="game" href="{url}">'
                  f'🎮 {escape(title)}</a>'
              )

          content = """<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>My English Games</title>
          <style>
          body {font-family:Arial,sans-serif;background:#f0f5ff;
          padding:30px;max-width:850px;margin:auto}
          h1{text-align:center;color:#243b73}
          p{text-align:center}
          .games{display:grid;gap:14px;margin-top:30px}
          .game{background:white;padding:20px;border-radius:14px;
          text-decoration:none;color:#243b73;font-size:18px;
          box-shadow:0 3px 10px #0001}
          .game:hover{background:#dfeaff}
          </style>
          </head>
          <body>
          <h1>🎮 My English Games</h1>
          <p>Choose a lesson and start playing!</p>
          <div class="games">
          """ + "\n".join(cards) + """
          </div>
          </body>
          </html>"""

          Path("index.html").write_text(content, encoding="utf-8")
          PY

      - name: Save updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update games catalog"
            git push
          fi
