name: Update games catalog

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote
          import re

          grades = [
              ("5th-grade", "5th Grade"),
              ("6th-grade", "6th Grade"),
              ("7th-grade", "7th Grade"),
              ("8th-grade", "8th Grade"),
              ("9th-grade", "9th Grade"),
              ("12th-grade", "12th Grade"),
          ]

          css = """
          body {font-family: Arial, sans-serif; background: #f1f5ff; margin: 0; padding: 24px; color: #23345d;}
          main {max-width: 900px; margin: auto}
          h1, .subtitle {text-align: center}
          details {background: white; border-radius: 16px; margin: 16px 0; padding: 18px; box-shadow: 0 3px 12px #0001;}
          summary {cursor: pointer; font-size: 23px; font-weight: bold;}
          .game {display: block; padding: 14px; margin-top: 12px; background: #edf3ff; border-radius: 10px; color: #2346a0; text-decoration: none;}
          .game:hover {background: #dbe7ff}
          """

          def lesson_order(path):
              name = path.stem.replace('_', ' ')
              unit = re.search(r'\bunit\s*[-.:, ]*\s*(\d+)', name, re.I)
              lesson = re.search(r'\blesson\s*[-.:, ]*\s*(\d+)', name, re.I)
              return (
                  int(unit.group(1)) if unit else float('inf'),
                  int(lesson.group(1)) if lesson else float('inf'),
                  name.casefold(),
              )

          sections = []
          for folder, label in grades:
              directory = Path(folder)
              files = sorted(
                  (p for p in directory.rglob('*') if p.is_file()
                   and p.suffix.lower() == '.html'
                   and p.name.lower() != 'index.html'),
                  key=lesson_order,
              ) if directory.exists() else []

              links = []
              for file in files:
                  title = escape(file.stem.replace('_', ' '))
                  url = '/'.join(quote(part) for part in file.parts)
                  links.append(f'<a class="game" href="{url}">🎮 {title}</a>')

              content = '\n'.join(links) or '<p>No games yet.</p>'
              sections.append(
                  f'<details><summary>📚 {label} ({len(files)} games)</summary>'
                  f'{content}</details>'
              )

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>My English Games</title>
          <style>{css}</style>
          </head>
          <body>
          <main>
          <h1>🎮 My English Games</h1>
          <p class="subtitle">Choose your grade and start playing!</p>
          {''.join(sections)}
          </main>
          </body>
          </html>"""
          Path('index.html').write_text(page, encoding='utf-8')
          PY

      - name: Save catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update games catalog"
            git push
          fi
