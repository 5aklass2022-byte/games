const VOC=[["herd", "/hɜːd/", "turmă", "стадо"], ["prairie", "/ˈpreəri/", "prerie", "прерия"], ["encounter", "/ɪnˈkaʊntə(r)/", "întâlnire neașteptată", "неожиданная встреча"], ["nevertheless", "/ˌnevəðəˈles/", "totuși", "тем не менее"], ["acquire", "/əˈkwaɪə(r)/", "a dobândi", "приобретать"], ["injured", "/ˈɪndʒəd/", "rănit", "раненый"], ["mile", "/maɪl/", "milă (1,609 km)", "миля (1,609 км)"], ["dude", "/duːd/", "tip; băiat (informal)", "чувак (разг.)"], ["cowgirl", "/ˈkaʊɡɜːl/", "cowgirl; femeie cowboy", "ковбойша"], ["ranch", "/rɑːntʃ/", "fermă de vite", "ранчо"], ["cattle", "/ˈkætəl/", "vite", "крупный рогатый скот"], ["fence", "/fens/", "gard", "забор"], ["chase", "/tʃeɪs/", "a urmări", "преследовать"], ["rattlesnake", "/ˈrætəlsneɪk/", "șarpe cu clopoței", "гремучая змея"], ["steep", "/stiːp/", "abrupt", "крутой"], ["stream", "/striːm/", "pârâu", "ручей"], ["barrier", "/ˈbæriə(r)/", "obstacol", "преграда"], ["truck", "/trʌk/", "camion", "грузовик"], ["skill", "/skɪl/", "abilitate", "навык"], ["soft skills", "/sɒft skɪlz/", "competențe personale", "гибкие навыки"], ["hard skills", "/hɑːd skɪlz/", "competențe tehnice", "профессиональные навыки"], ["look after", "/lʊk ˈɑːftə(r)/", "a avea grijă de", "присматривать за"], ["break down", "/breɪk daʊn/", "a se defecta", "ломаться"], ["get off", "/ɡet ɒf/", "a coborî", "выходить из транспорта"], ["get on", "/ɡet ɒn/", "a urca", "садиться в транспорт"], ["turn back", "/tɜːn bæk/", "a se întoarce", "поворачивать обратно"], ["take off", "/teɪk ɒf/", "a decola", "взлетать"], ["check in", "/tʃek ɪn/", "a se înregistra", "регистрироваться"]], TEXT="Cowboys all lived in the 19th century, when the Wild West really was wild. There are no cowboys in the USA in the 21st century. Right? No, wrong! Even today, there are still men and women who work as cowboys and cowgirls in the western USA, Canada, and in South America too.\nThere are still thousands of ranchers in the American west. They still ride horses and they still carry guns; but they do not spend their time fighting Indians. Although they often travel on four wheels, not four legs, cowboys still have to be expert horsemen too. They ride horses very regularly.\nSome of the ranches in the American West cover thousands of hectares. Cattle are often free to move over large areas. There are steep hills, rivers and streams, forests and rocks. In many places, it is impossible to use a pick-up, even with four-wheel drive. Even motorbikes are useless. The only ways to cross the prairies are on horseback or on foot.\nCowboys and cowgirls are working men and women. They look after the herds of cattle that live on the prairies in the mountains from Texas to Canada. They have lots of jobs to do. They have to mark cattle so that they can be identified. They have to move cattle from place to place. Moreover, they have to vaccinate them and check that they are healthy. They also have to inspect miles and miles of fences and barbed-wire barriers.\nThere is no shortage of people who want to be cowboys. The profession has a very special reputation. It is different from other jobs, but it can be hard work, with long hours. Besides, many cowboys and cowgirls are not very well-paid. It can also be a dangerous job.\nCowboys do not often fall off their horses, of course. They have to be excellent riders and they carry guns for two reasons. Firstly, they may have to kill an injured animal - a cow or even a horse. Secondly, they may encounter dangerous wild animals, such as rattlesnakes. There are bears and wolves too, but they do not usually attack human beings. Nevertheless, it is useful to have a gun, just in case...\nToday, there are no more long cattle drives. These days, cattle are picked up in big trucks and taken to new destinations by road. That is one thing that has changed. Another more modern idea is the “dude ranch”. Anyone can become a cowboy or a cowgirl for a week or more, if he or she has money. Dude ranches offer holidays to people who want to be part-time cowboys or cowgirls. Of course, dudes do not do much real work, but they enjoy the spirit of the west.";

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function choice(id,q,opts,answer,why=''){let shuffled=shuffle(opts);return `<div class="exercise"><p><b>${q}</b></p><div class="options">${shuffled.map(o=>`<label><input type="radio" name="${id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div><button class="action" onclick="checkChoice('${id}',${JSON.stringify(answer).replaceAll('"','&quot;')},${JSON.stringify(why).replaceAll('"','&quot;')})">Check ✓</button><div class="feedback" id="f-${id}"></div></div>`}

function entry(id,q,answers,why=''){return `<div class="exercise"><p><b>${q}</b></p><input type="text" id="i-${id}" autocomplete="off" placeholder="Type your answer"><button class="action" onclick="checkEntry('${id}')">Check ✓</button><div class="feedback" id="f-${id}"></div></div>`}
const answerMap={};function addEntry(id,q,answers,why=''){answerMap[id]=[Array.isArray(answers)?answers:[answers],why];return entry(id,q,answers,why)}
function checkEntry(id){let [ans,why]=answerMap[id],v=document.getElementById('i-'+id).value.trim().toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ');mark(id,ans.some(a=>a.toLowerCase()===v),ans[0],why)}

function generateVex(){let target=document.getElementById('vex');if(!target)return;let html='<h3>A. Match English words to translations</h3>';shuffle(core).slice(0,6).forEach((v,i)=>{let choices=shuffle([v,...shuffle(core.filter(x=>x!==v)).slice(0,3)]).map(tr);html+=choice('vm'+i,'What does <b>'+v[0]+'</b> mean?',choices,tr(v),'Choose the meaning of the English word.')});html+='<h3>B. Choose the English word</h3>';shuffle(core).slice(0,5).forEach((v,i)=>{html+=choice('ve'+i,'🇷🇴 / 🇷🇺 <b>'+tr(v)+'</b>',shuffle([v[0],...shuffle(core.filter(x=>x!==v)).slice(0,3).map(x=>x[0])]),v[0])});html+='<h3>C. Complete the sentences</h3>';[['The cattle travel together in a large ____.','herd'],['The cowboys crossed a wide ____.','prairie'],['He was ____ in the accident.','injured'],['She worked hard to ____ new skills.','acquire'],['The trip was difficult; ____, we continued.','nevertheless']].forEach((x,i)=>html+=addEntry('vc'+i,x[0],x[1]));html+='<h3>D. Listen and identify</h3>';shuffle(core).slice(0,4).forEach((v,i)=>{html+=`<div class="exercise"><button class="smallbtn" onclick="speech('${v[0]}')">🔊 Play word</button></div>`+choice('va'+i,'Which word did you hear?',shuffle([v[0],...shuffle(core.filter(x=>x!==v)).slice(0,3).map(x=>x[0])]),v[0])});target.innerHTML=html}

const gramRO='Verbele frazale sunt combinații verb + particulă (ex.: <b>get on</b> = a urca într-un mijloc de transport). Sensul lor nu este întotdeauna literal. <b>Past Simple</b>: get on → got on, take off → took off, break down → broke down, turn back → turned back. Folosește forma potrivită contextului.';
const gramRU='Фразовые глаголы — это сочетания глагола с частицей (например, <b>get on</b> = садиться в транспорт). Значение не всегда можно понять дословно. <b>Past Simple</b>: get on → got on, take off → took off, break down → broke down, turn back → turned back. Выбирай форму по смыслу и времени.';

let grammarStory=`John and David’s flight home from London was at nine in the morning. They had arranged to meet with John’s friend Mark at half past six but Mark arrived at the hotel almost half an hour later — that was just the beginning of their problems. On the way from the hotel to the airport, their car (1) ______ in the middle of a busy intersection, causing a traffic jam. Then, David realised that he had left his mobile phone in the hotel, but it was too late for them to (2) ______. When they arrived at the airport, they had just enough time to (3) ______, go through passport control and security check and (4) ______ the plane. The plane (5) ______ very shortly after that and eight hours later, they landed in New York, but they couldn’t (6) ______ the plane because there was a problem on the runway. They felt a jet lag and finally, forty-five minutes after landing, they (7) ______.`;
const gramAnswers=[['broke down','break down → broke down: Past Simple, the car stopped working.'],['turn back','turn back: return in the opposite direction; after “to” use the base form.'],['check in','check in: register for a flight; after “to” use the base form.'],['get on','get on the plane: board it; coordinated with “go through”.'],['took off','take off → took off: the plane left the ground in the past.'],['get off','get off the plane: leave the aircraft; after “couldn’t” use the base form.'],['got off','get off → got off: Past Simple after “finally”.']];
document.getElementById('grammar').innerHTML=`<h2>🧠 Grammar — Exercise 12</h2><h3>Before you practise: Phrasal verbs</h3><div class="hint"><b>English:</b> A phrasal verb is a verb plus a particle (e.g., <b>get off</b>). Together they often have a new meaning. After <i>to</i> and modal verbs, use the base form; for completed past events, use Past Simple.</div>${langBtns()}<div class="info" id="gramhelp"></div><div class="cards">${VOC.slice(-6).map(v=>`<div class="card"><b>${v[0]}</b><div>${v[1]}</div><div data-trans="${v[0]}">${tr(v)}</div><button class="smallbtn" onclick="speech('${v[0]}')">🔊</button></div>`).join('')}</div><h3>Textbook Exercise 12 · Complete the story</h3><div class="reading"><p>${esc(grammarStory)}</p></div><p><b>Word bank:</b> check in, get on, get off (×2), break down, take off, turn back</p><div id="gramquiz"></div><h3>Extra grammar practice</h3><div id="gramextra"></div>`;document.getElementById('gramquiz').innerHTML=gramAnswers.map((x,i)=>addEntry('g'+i,`Gap (${i+1}) — write the correct phrasal verb form.`,x[0],x[1])).join('');document.getElementById('gramextra').innerHTML=[['Our plane ____ at 9 a.m. yesterday.',['took off','take off','get on'],'took off','Yesterday → Past Simple of take off.'],['We need to ____ before our flight.',['check in','checked in','turn back'],'check in','After “to” use the base form.'],['The bus stopped and we ____.',['got off','get on','take off'],'got off','Leaving a bus = get off; past = got off.']].map((x,i)=>choice('ge'+i,x[0],x[1],x[2],x[3])).join('');
const model=`MY DREAM JOB: SOFTWARE DEVELOPER

document.getElementById('writing').innerHTML=`<h2>✍️ Writing — textbook Exercise 13</h2><p><b>Task:</b> Create an infographic about your dream job. Include skills, advantages and famous people who chose the same job. Use the recommended structure: title, introduction, skills, advantages, role model, conclusion.</p><div class="hint"><b>Step-by-step instructions:</b> (1) Choose a job. (2) Write a short description. (3) List 2–3 hard skills and 2–3 soft skills. (4) Explain 2 advantages and one challenge. (5) Name a real professional or role model if you know one. (6) Add a final personal goal. You can write first, then turn the text into a visual infographic using paper or a free design tool.</div><details class="model" open><summary>📝 Model infographic text (click to hide)</summary><p style="white-space:pre-line">${esc(model)}</p></details><h3>Write your own infographic text</h3><textarea id="essay" placeholder="MY DREAM JOB: ...

function countWords(){let t=document.getElementById('essay').value.trim();document.getElementById('wc').textContent=(t?t.split(/\s+/).length:0)+' words'}function checkWriting(){let t=document.getElementById('essay').value,n=t.trim()?t.trim().split(/\s+/).length:0;let items=[['job / profession',/job|developer|teacher|designer|doctor|engineer|photographer/i],['skills',/skill|communication|teamwork|programming|creative/i],['advantages',/advantage|benefit|opportunity|enjoy|like/i],['role model',/admire|role model|inspire|famous/i],['personal goal',/want|plan|hope|goal|will/i]];let missing=items.filter(x=>!x[1].test(t)).map(x=>x[0]);let el=document.getElementById('f-writing');el.className='feedback show '+(missing.length?'bad':'');el.innerHTML=`📝 ${n} words. ${missing.length?'Consider adding: '+missing.join(', ')+'.':'All key ideas appear to be present.'} <br>✔ Model and structure are shown above. Check spelling and grammar with your teacher.`;completed.add('writing')}
