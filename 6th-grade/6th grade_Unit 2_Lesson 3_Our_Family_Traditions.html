h+=section('grammar','📘 Grammar — Past Simple','<div class="grid"><div class="tile"><h3>🟦 Regular verbs</h3><p>Verb + <b>-ed</b></p><p>create → created<br>invite → invited<br>contain → contained</p></div><div class="tile"><h3>🟪 Irregular verbs</h3><p>Learn the special form.</p><p>send → <b>sent</b><br>become → <b>became</b><br>go → <b>went</b></p></div></div><div class="bar"><button onclick="document.getElementById(&quot;grRO&quot;).classList.toggle(&quot;hidden&quot;)">🇷🇴 Explicație</button><button onclick="document.getElementById(&quot;grRU&quot;).classList.toggle(&quot;hidden&quot;)">🇷🇺 Объяснение</button></div><div class="note hidden" id="grRO">Past Simple descrie acțiuni încheiate în trecut. La verbele regulate adăugăm -ed: play → played. Verbele neregulate au forme speciale: send → sent.</div><div class="note hidden" id="grRU">Past Simple обозначает завершённые действия в прошлом. У правильных глаголов добавляем -ed: play → played. Неправильные глаголы имеют особую форму: send → sent.</div>'+btnModel('Yesterday we visited our grandparents. Last year my mother baked cookies.'));
