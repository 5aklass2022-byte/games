/* Layout: one column. A home path of eight stages; each stage opens as a screen with learn blocks first, then scored practice cards. Colour tabs echo the textbook (green, blue, pink). */
:root{
  --bg:#f1f7f6; --surface:#ffffff; --ink:#12303a; --muted:#4a666e; --line:#cfe0de;
  --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --green:#cfeedd; --blue:#d3e9f7; --pink:#fbd9d9;
  --sun:#e9a23b; --good:#1d8a50; --good-soft:#d9f2e3; --bad:#c0392f; --bad-soft:#fbe0dd;
  --display:'Comfortaa','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b20; --surface:#16282f; --ink:#e5f0ef; --muted:#9fb8bc; --line:#2a444c;
    --accent:#52c4cf; --accent-ink:#06282d; --accent-soft:#17383e;
    --green:#1c3d30; --blue:#1b3a4d; --pink:#442a2e;
    --sun:#f3b55a; --good:#58c68a; --good-soft:#173a2a; --bad:#f08a80; --bad-soft:#442523;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b20; --surface:#16282f; --ink:#e5f0ef; --muted:#9fb8bc; --line:#2a444c;
  --accent:#52c4cf; --accent-ink:#06282d; --accent-soft:#17383e;
  --green:#1c3d30; --blue:#1b3a4d; --pink:#442a2e;
  --sun:#f3b55a; --good:#58c68a; --good-soft:#173a2a; --bad:#f08a80; --bad-soft:#442523;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin:10px 0 14px}
.tabs i{display:block;height:10px;border-radius:3px}
.tabs i:nth-child(1){width:64px;background:var(--green)}
.tabs i:nth-child(2){width:34px;background:var(--blue)}
.tabs i:nth-child(3){width:34px;background:var(--pink)}
.kicker{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xp{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.xp svg{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:800;text-decoration:none}

/* home path */
.lead{color:var(--muted);max-width:60ch;margin:6px 0 18px}
.path{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:12px}
.path::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:4px;border-radius:2px;background:var(--line)}
.path li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;position:relative}
.node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface);border:3px solid var(--line);color:var(--muted);z-index:1}
.node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stagebtn{text-decoration:none;color:inherit;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stagebtn:hover{border-color:var(--accent)}
.stagebtn .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stagebtn h3{margin-bottom:2px}
.stagebtn .sub{color:var(--muted);font-size:.93rem}
.stagebtn .ref{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:6px;color:var(--ink)}
.t-green{background:var(--green)} .t-blue{background:var(--blue)} .t-pink{background:var(--pink)}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.star-on{fill:var(--sun)} .star-off{fill:none;stroke:var(--line);stroke-width:1.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;min-width:0}
.card > h2,.card > h3{margin-bottom:8px}
.note{color:var(--muted);font-size:.93rem}
.stagehead{display:flex;gap:12px;align-items:center;margin:4px 0 4px}
.stagehead .tag{flex:none;width:12px;align-self:stretch;border-radius:6px}
.status{margin-top:10px;font-weight:800;color:var(--muted)}
.status.ok{color:var(--good)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:800}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
.chip{background:var(--accent-soft);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:6px 13px;font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.listen{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.8rem;font-weight:800;color:var(--accent)}

/* vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.vc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:4px;align-content:start;min-width:0}
.vc .en{font-family:var(--display);font-weight:700;font-size:1.1rem}
.vc .ipa{color:var(--muted);font-size:.9rem}
.tr{display:flex;gap:8px;align-items:baseline}
.lang{flex:none;font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--blue);color:var(--ink)}
.lang.ru{background:var(--pink)}
.vc .eg{font-size:.9rem;color:var(--muted);font-style:italic}
.vc.cover .tr span:last-child{filter:blur(7px);cursor:pointer;user-select:none}
.vc.cover.shown .tr span:last-child{filter:none}
.grouphead{margin-top:18px;display:flex;align-items:center;gap:8px}
.grouphead i{width:26px;height:8px;border-radius:3px;display:block}

/* reading */
.dialogue{display:grid;gap:10px;margin-top:8px}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start}
.who{font-weight:800;font-size:.92rem;padding:2px 8px;border-radius:6px;text-align:center}
.who.leo{background:var(--blue)} .who.helen{background:var(--pink)} .who.tim{background:var(--green)} .who.alex{background:var(--blue)}
.say{font-size:1.04rem}
.w{border-bottom:2px dotted var(--accent);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;color:inherit}
.w.new{background:var(--accent-soft);border-bottom-style:solid;border-radius:3px}
.gloss{position:sticky;bottom:10px;margin-top:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:grid;gap:2px;z-index:3}
.gloss b{font-family:var(--display)}
.textpanel{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.panelfig{width:100%;display:block}

/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:5px;margin:8px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.intro{color:var(--muted);margin-bottom:8px}
.prompt{font-size:1.1rem;font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.answers{display:grid;gap:8px}
.answers.bank{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fill{color:var(--good);border-bottom:3px solid var(--good)}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--muted);text-align:center}
.typebox{display:flex;gap:8px;flex-wrap:wrap}
.typebox input,.sentrow input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.typebox input{flex:1 1 180px}
.typebox input:focus,.sentrow input:focus,textarea:focus{border-color:var(--accent);outline:none}
.fb{min-height:1.5em;margin-top:12px}
.fb .ok{color:var(--good);font-weight:800}
.fb .no{color:var(--bad);font-weight:800}
.nav{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:8px 0}
.result .stars svg{width:38px;height:38px}
.big{font-family:var(--display);font-size:1.5rem;font-weight:700}

/* grammar */
.explain{display:grid;gap:8px}
.lng{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
.scroll{overflow-x:auto;max-width:100%}
.eg-box{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:2px 0}

/* match */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.matchgrid button{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.matchgrid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.matchgrid button.done{border-color:var(--good);background:var(--good-soft);cursor:default}

/* spinner + speaking */
.spin{font-size:1.15rem;font-weight:700;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:14px;margin:10px 0;min-height:4.2em}

/* writing */
.sentrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.sentrow label{font-weight:800}
.sentrow .st{grid-column:2;font-size:.9rem}
.sentrow input{width:100%}
textarea{width:100%;min-height:190px;resize:vertical;line-height:1.5}
.checklist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.checklist li.ok .dot{background:var(--good);border-color:var(--good)}
.checklist li.ok{color:var(--good);font-weight:700}

@media (max-width:520px){
  .line{grid-template-columns:minmax(0,1fr)}
  .line .listen{justify-self:start}
  .who{justify-self:start}
  .sentrow{grid-template-columns:minmax(0,1fr)}
  .sentrow .st{grid-column:1}
  .matchgrid{gap:8px}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).toLowerCase().replace(/’/g,"'").replace(/[.!?,;]+$/,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
var S={name:'',q:{}};
try{var raw=localStorage.getItem('uf-quest');if(raw){var o=JSON.parse(raw);if(o&&o.q)S=o}}catch(e){}
function save(){try{localStorage.setItem('uf-quest',JSON.stringify(S))}catch(e){}}
function totalXP(){var t=0;for(var k in S.q)t+=S.q[k].pts;return t}

function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){return canSay?'<button class="listen" type="button" data-say="'+esc(t)+'" aria-label="Listen">Listen</button>':''}
function rate(c,t){var p=t?c/t:0;return p>=.85?3:p>=.6?2:1}
function starsSVG(n){var s='';for(var i=0;i<3;i++)s+='<svg viewBox="0 0 24 24" aria-hidden="true"><path class="'+(i<n?'star-on':'star-off')+'" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';return '<span class="stars" role="img" aria-label="'+n+' of 3 stars">'+s+'</span>'}

function copyText(text,btn,host){
 var label=btn.textContent;
 function ok(){btn.textContent='Copied';setTimeout(function(){btn.textContent=label},1600)}
 function fallback(){
  var t=host.querySelector('textarea.copybox');
  if(!t){t=document.createElement('textarea');t.className='copybox';t.readOnly=true;t.style.minHeight='110px';t.style.marginTop='8px';host.appendChild(t)}
  t.value=text;t.focus();t.select();btn.textContent='Select and copy the text below';
 }
 try{navigator.clipboard.writeText(text).then(ok,fallback)}catch(e){fallback()}
}

function quiz(root,id,title,items,intro){
 var card=mk(root,'card quiz');card.id='q-'+id;
 var list,i,pts,c,tries;
 function start(){list=typeof items==='function'?items():items;i=0;pts=0;c=0;step()}
 function step(){
  if(i>=list.length)return finish();
  var it=list[i];tries=0;
  var opts=it.type?null:(it.fixed?it.opts.slice():shuffle(it.opts));
  var maxT=opts?Math.min(2,opts.length-1):2;
  var acc=(it.acc||[it.a]).map(norm);
  card.innerHTML='<div class="qhead"><h3>'+title+'</h3><span class="count">'+(i+1)+' / '+list.length+'</span></div><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div>'+(intro&&i===0?'<p class="intro">'+intro+'</p>':'')+'<p class="prompt"></p><div class="answers'+(it.blank&&opts&&opts.length>3?' bank':'')+'"></div><div class="fb" role="status" aria-live="polite"></div><div class="nav"></div>';
  var prompt=card.querySelector('.prompt'),ans=card.querySelector('.answers'),fb=card.querySelector('.fb'),nav=card.querySelector('.nav');
  function showQ(f){prompt.innerHTML=it.blank||it.type?it.q.replace('____',f?'<b class="fill">'+f+'</b>':'<span class="blank">&nbsp;</span>'):it.q}
  showQ();
  if(it.say)nav.innerHTML=listenBtn(it.say);
  function lock(){ans.querySelectorAll('button,input').forEach(function(b){b.disabled=true})}
  function award(){var p=tries===0?10:tries===1?5:0;pts+=p;if(tries===0)c++;return p}
  function next(){
   var last=i===list.length-1;
   nav.insertAdjacentHTML('beforeend','<button class="btn" type="button">'+(last?'See my score':'Next')+'</button>');
   var b=nav.querySelector('.btn');b.focus();b.onclick=function(){i++;step()};
  }
  function right(shown){var p=award();showQ(shown);fb.innerHTML='<span class="ok">Correct!'+(p?' +'+p+' XP':'')+'</span> '+(it.ex||'');lock();next()}
  function reveal(){showQ(it.a);fb.innerHTML='<span class="no">Not quite.</span> The answer is <b>'+it.a+'</b>. '+(it.ex||'');lock();
   ans.querySelectorAll('button.opt').forEach(function(b){if(acc.indexOf(norm(b.textContent))>-1)b.classList.add('good')});next()}
  if(opts){
   opts.forEach(function(o){
    var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o;
    b.onclick=function(){
     if(acc.indexOf(norm(o))>-1){b.classList.add('good');right(o)}
     else{b.classList.add('bad','shake');b.disabled=true;tries++;
      if(tries>=maxT)reveal();else fb.innerHTML='<span class="no">Try again.</span> You can still earn 5 XP.'}
    };
    ans.appendChild(b);
   });
  }else{
   ans.className='typebox';
   ans.innerHTML='<input type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Your answer" placeholder="Type the word"><button class="btn" type="button">Check</button>';
   var inp=ans.querySelector('input'),go=ans.querySelector('button');
   function check(){
    var v=norm(inp.value);if(!v)return;
    if(acc.indexOf(v)>-1){right(it.a||acc[0])}
    else{tries++;inp.classList.add('shake');
     if(tries>=2){it.a=it.a||it.acc[0];reveal()}
     else{fb.innerHTML='<span class="no">Try again.</span> Hint: it starts with “'+acc[0].charAt(0)+'” and has '+acc[0].length+' letters.';inp.select()}}
   }
   go.onclick=check;inp.onkeydown=function(e){if(e.key==='Enter')check()};
   inp.focus();
  }
 }
 function finish(){
  var rec=S.q[id];if(!rec||pts>=rec.pts){S.q[id]={pts:pts,c:c,t:list.length};save()}
  card.innerHTML='<div class="result"><h3>'+title+'</h3>'+starsSVG(rate(c,list.length))+'<div class="big">'+c+' of '+list.length+' right the first time</div><p class="note">+'+pts+' XP this round. Best round: '+S.q[id].pts+' XP.</p><button class="btn" type="button">Play again</button></div>';
  card.querySelector('.btn').onclick=start;
  refreshHud();
 }
 start();
}

function matchGame(root){
 var card=mk(root,'card');var lang='ro';
 function round(){
  var pool=shuffle(CORE).slice(0,6),right=shuffle(pool),sel=null,done=0,first=0,missed={};
  card.innerHTML='<h3>Match the words</h3><p class="note">Tap an English word, then tap its translation. Each first-try match gives 5 XP.</p><div class="row-wrap" style="margin-top:8px"><button class="chip'+(lang==='ro'?' on':'')+'" data-l="ro" type="button">Romanian</button><button class="chip'+(lang==='ru'?' on':'')+'" data-l="ru" type="button">Russian</button></div><div class="matchgrid"></div><div class="fb" role="status" aria-live="polite"></div>';
  var grid=card.querySelector('.matchgrid'),fb=card.querySelector('.fb');
  pool.forEach(function(w,i){
   var l=document.createElement('button');l.type='button';l.textContent=w.en;l.dataset.k=w.en;l.style.gridColumn='1';grid.appendChild(l);
   var r=document.createElement('button');r.type='button';r.textContent=right[i][lang];r.dataset.k=right[i].en;r.style.gridColumn='2';grid.appendChild(r);
   l.dataset.side='l';r.dataset.side='r';
  });
  grid.addEventListener('click',function(e){
   var b=e.target.closest('button');if(!b||b.classList.contains('done'))return;
   if(b.dataset.side==='l'){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
   if(!sel)return;
   if(sel.dataset.k===b.dataset.k){
    sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');
    if(!missed[sel.dataset.k])first++;
    sel=null;done++;
    if(done===6){
     var p=first*5,rec=S.q.match;if(!rec||p>=rec.pts){S.q.match={pts:p,c:first,t:6};save()}
     fb.innerHTML='<div class="result">'+starsSVG(rate(first,6))+'<div class="big">'+first+' of 6 on the first try (+'+p+' XP)</div><button class="btn" type="button" id="again">New round</button></div>';
     fb.querySelector('#again').onclick=round;refreshHud();
    }
   }else{
    missed[sel.dataset.k]=true;b.classList.add('shake');sel.classList.add('shake');
    var s2=sel;setTimeout(function(){b.classList.remove('shake');s2.classList.remove('shake')},350);
    fb.innerHTML='<span class="no">Not that one.</span> Try again.';
   }
  });
  card.querySelectorAll('[data-l]').forEach(function(c){c.onclick=function(){lang=c.dataset.l;round()}});
 }
 round();
}

  '<tr><td><b>use</b><br>folos · польза</td><td><b>useful</b><br>util · полезный</td><td><b>useless</b><br>inutil · бесполезный</td></tr>'+

function checkSentence(word,val){
 var v=val.trim();if(!v)return null;
 var probs=[];
 if(!new RegExp('\\b'+word+'(s|ed|ing)?\\b','i').test(v))probs.push('Use the word “'+word+'”.');
 if(v.split(/\s+/).length<4)probs.push('Write at least 4 words.');
 if(!/^[A-Z]/.test(v))probs.push('Start with a capital letter.');
 if(!/[.!?]$/.test(v))probs.push('End with a full stop.');
 return probs;
}

 document.getElementById('cr').onclick=function(){
  var t='A United Family Quest – '+(S.name||'(no name)')+'\nTotal: '+totalXP()+' XP, '+done+' of '+STAGES.length+' stages complete\n'+STAGES.map(function(st,i){var s=stageStats(st);return (i+1)+'. '+st.title+': '+(isDone(st)?stageStars(st)+'/3 stars ('+s.c+'/'+s.t+' first try)':'not finished')}).join('\n');
  copyText(t,this,rh);
 };
 var rs=document.getElementById('rs'),armed=false;
 rs.onclick=function(){
  if(!armed){armed=true;rs.textContent='Press again to erase all progress';setTimeout(function(){armed=false;rs.textContent='Start over'},4000);return}
  S={name:S.name,q:{}};DR={};save();try{localStorage.removeItem('uf-draft')}catch(e){}home();
 };
}
function stageScreen(n){
 var st=STAGES[n-1];
 app.innerHTML='<a class="back" href="#">← All stages</a><div class="top"><span class="kicker">'+st.ref+'</span><span class="xp" id="hudxp">'+xpHTML()+'</span></div><div class="stagehead"><span class="tag" style="background:var(--'+st.tint+')"></span><h1>'+st.title+'</h1></div><p class="lead" style="margin-bottom:0">'+st.sub+'</p><div class="status" id="status"></div><div id="blocks"></div><div id="after"></div>';
 st.build(document.getElementById('blocks'));
 refreshHud();
}
function route(){
 var m=/^#stage-(\d+)$/.exec(location.hash),n=m?+m[1]:0;
 if(n>=1&&n<=STAGES.length){cur=n;stageScreen(n)}else{cur=0;home()}
 window.scrollTo(0,0);
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
