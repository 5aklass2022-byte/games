ther on the day of the formal attempt. Being a Guinness World Records holder is very incredible and represents a major life accomplishment for Alexander. Though he doesn't want to stop here, Alexander is already considering even more significant things to perform.", "poem": "Every single day we should ask,\nOurselves an _____ question.\nWhat _____ will we complete today,\nThat will end in a happy expression?\n\nGoals are so very important in life,\nIn order _____ to grow.\nYou can only become someone important,\nIf you first believe it so.\n\n_____ goals that will better your life,\nIs how one can become who they want to be.\nSo trust in yourself that you are enough,\nAnd soon you will be able to see.\n\nSo ask _____ where you want to go,\nThen create goals that will get you there.\nTake each goal as a single _____\nAnd this is how you will prepare.", "vocab": [["imaginary", "/ɪˈmædʒɪnəri/", "imaginar", "воображаемый"], ["construct", "/kənˈstrʌkt/", "a construi", "строить"], ["aware of", "/əˈweə(r) əv/", "conștient de", "осведомлённый о"], ["verify", "/ˈverɪfaɪ/", "a verifica", "проверять"], ["worthy", "/ˈwɜːði/", "demn de", "достойный"], ["carriage", "/ˈkærɪdʒ/", "vagon", "вагон"], ["achievement", "/əˈtʃiːvmənt/", "realizare", "достижение"], ["goal", "/ɡəʊl/", "obiectiv", "цель"], ["record", "/ˈrekɔːd/", "record", "рекорд"], ["track", "/træk/", "cale ferată", "железнодорожный путь"], ["locomotive", "/ˌləʊkəˈməʊtɪv/", "locomotivă", "локомотив"], ["accomplishment", "/əˈkʌmplɪʃmənt/", "realizare", "свершение"], ["lengthy", "/ˈleŋθi/", "lung", "длинный"], ["individual", "/ˌɪndɪˈvɪdʒuəl/", "persoană", "человек"], ["magnificent", "/mæɡˈnɪfɪsənt/", "magnific", "великолепный"], ["series", "/ˈsɪəriːz/", "serial", "сериал"]], "dictionary": {"a": ["un", "один"], "14-year-old": ["de 14 ani", "14-летний"], "kid": ["copil", "ребёнок"], "from": ["din", "из"], "new": ["nou", "новый"], "zealand": ["Zeelandă", "Зеландия"], "named": ["numit", "по имени"], "has": ["a", "имеет"], "beat ": ["demn de", "достойный"], "carriage": ["vagon", "вагон"], "achievement": ["realizare", "достижение"], "goal": ["obiectiv", "цель"], "record": ["record", "рекорд"], "track": ["cale ferată", "железнодорожный путь"], "locomotive": ["locomotivă", "локомотив"], "accomplishment": ["realizare", "свершение"], "lengthy": ["lung", "длинный"], "individual": ["persoană", "человек"], "magnificent": ["magnific", "великолепный"], "series": ["serial", "сериал"]}, "questions": {"ex5": [["taking a long time", "lengthy"], ["relating to a single, separate person or thing", "individual"], ["an occasion for a special look at an exhibition, film, etc.", "viewing"], ["very good, beautiful, or deserving to be admired", "magnificent"], ["a number of similar or related events or things, one following another", "series"]], "ex6": [["Alexander has never beaten a record of 69 carriages.", "False", "He beat the previous record with 101 carriages."], ["He received his first LEGO set at the age of 14.", "False", "He received it when he was four."], ["He worked on his new record in around fifty hours.", "True", "The 101 carriages were constructed in around 50 hours."], ["The boy created a longer track to travel on.", "True", "He needed a longer track for the long train."], ["Alexander worked alone to build the track and link all the carriages together.", "False", "A group of ten individuals helped him."]], "ex7": [["child", "kid"], ["get", "receive"], ["wonderful", "magnificent"], ["able", "capable"], ["connect", "link"], ["wagon", "carriage"], ["huge", "sizable"], ["check", "verify"], ["drag", "pull"], ["major", "significant"]], "ex8": [["_____ very hot outside.", "It’s"], ["_____ a magazine on the bedside table.", "There’s"], ["_____ 8 o’clock in the evening.", "It’s"], ["_____ old enough.", "It’s"], ["_____ something strange in your drink.", "There’s"], ["_____ a horror film at 10:30.", "There’s"], ["_____ time to go.", "It’s"], ["_____ tea or coffee. Which would you prefer?", "There’s"], ["_____ easy to answer the phone.", "It’s"], ["_____ another meeting at 9 o’clock.", "There’s"]], "ex9": [["_____ a small table in front of the sofa.", "There is"], ["_____ a wooden table.", "It is"], ["_____ is a picture on the wall. _____ my family portrait.", "There / It’s"], ["_____ a bus at 9:30. We can wait for it at the station.", "There is"], ["_____ a sports shop around the corner.", "There is"], ["_____ a big shop.", "It is"], ["_____ very late, Jane. We must go.", "It is"], ["The hotel is expensive but _____ a wonderful restaurant inside.", "there is"]]}};let lang='EN',state={},speechState={sentences:[],index:0,paused:false,playing:false,token:0};const I={EN:['Instructions','Check Answer','Correct!','Try again. Correct answer:','Show translation','Hide translation'],RO:['Instrucțiuni','Verifică răspunsul','Corect!','Mai încearcă. Răspuns corect:','Arată traducerea','Ascunde traducerea'],RU:['Инструкция','Проверить ответ','Правильно!','Попробуй ещё. Правильный ответ:','Показать перевод','Скрыть перевод']};const directions={vocab:['Study the words. Listen and reveal the translation only when needed.','Studiază cuvintele. Ascultă și descoperă traducerea când ai nevoie.','Изучи слова. Слушай и открывай перевод по необходимости.'],warm:['Discuss the questions and interview a classmate.','Discută întrebările și intervievează un coleg.','Обсуди вопросы и возьми интервью у одноклассника.'],poem:['Complete the poem using each word from the Word Bank once.','Completează poezia folosind fiecare cuvânt din banca de cuvinte o singură dată.','Заполни пропуски в стихотворении словами из банка слов. Каждое слово используй один раз.'],read:['Read the complete text. Click any word to see its RO/RU meaning and hear it.','Citește textul integral. Apasă pe orice cuvânt pentru traducere și pronunțare.','Прочитай полный текст. Нажми на слово, чтобы увидеть перевод и услышать произношение.'],ex5:['Find the highlighted words in the text that match the definitions.','Găsește în text cuvintele evidențiate care corespund definițiilor.','Найди в тексте выделенные слова по определениям.'],ex6:['Read the statements and decide True or False.','Citește enunțurile și decide Adevărat sau Fals.','Прочитай утверждения и выбери верно или неверно.'],ex7:['Find synonyms in the reading text. Type one word for each item.','Găsește sinonime în text. Scrie câte un cuvânt.','Найди синонимы в тексте. Впиши по одному слову.'],ex8:['Choose It’s or There’s in each sentence.','Alege It’s sau There’s pentru fiecare propoziție.','Выбери It’s или There’s для каждого предложения.'],ex9:['Fill in it is / it’s or there is / there are.','Completează cu it is / it’s sau there is / there are.','Заполни пропуски выражениями it is / it’s или there is / there are.'],pron:['Listen, practise, then reveal the translation.','Ascultă, exersează, apoi descoperă traducerea.','Послушай, потренируйся, затем открой перевод.'],writing:['Write a formal email requesting information about activities at a cultural youth centre.','Scrie un e-mail formal pentru a solicita informații despre activitățile unui centru cultural pentru tineri.','Напиши официальное письмо с просьбой предоставить информацию о занятиях в молодёжном культурном центре.']};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setLang(l){lang=l;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.l===l));document.querySelectorAll('[data-i]').forEach(e=>{let a=directions[e.dataset.i];if(a)e.textContent=a[['EN','RO','RU'].indexOf(l)]});document.querySelectorAll('.transBtn').forEach(b=>b.textContent=b.dataset.shown==='1'?I[l][5]:I[l][4]);document.querySelectorAll('.check').forEach(b=>b.textContent=I[l][1]);}function langbar(){return '<div class="bar"><span class="muted">EN / RO / RU</span>'+['EN','RO','RU'].map(l=>'<button class="lang '+(l===lang?'active':'')+'" data-l="'+l+'" onclick="setLang(\''+l+'\')">'+l+'</button>').join('')+'</div>'}function speak(t){if(!('speechSynthesis'in window)){alert('Speech synthesis is unavailable in this browser.');return}stopAudio();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;window.speechSynthesis.speak(u)}function stopAudio(){speechState.token++;window.speechSynthesis?.cancel();speechState.playing=false;speechState.paused=false;document.getElementById('audioStatus').textContent='Stopped'}function splitSentences(t){return t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(x=>x.trim()).filter(Boolean)||[t]}function playSentence(token){if(token!==speechState.token||speechState.paused||speechState.index>=speechState.sentences.length){if(speechState.index>=speechState.sentences.length){speechState.playing=false;document.getElementById('audioStatus').textContent='Finished'}return}let u=new SpeechSynthesisUtterance(speechState.sentences[speechState.index]);u.lang='en-GB';u.rate=.87;u.onend=()=>{if(token!==speechState.token||speechState.paused)return;speechState.index++;playSentence(token)};u.onerror=e=>{document.getElementById('audioStatus').textContent='Audio: '+e.error};document.getElementById('audioStatus').textContent='Playing sentence '+(speechState.index+1)+' / '+speechState.sentences.length;window.speechSynthesis.speak(u)}function readStart(){stopAudio();speechState.sentences=splitSentences(DATA.reading);speechState.index=0;speechState.playing=true;playSentence(speechState.token)}function readPause(){if(!speechState.playing)return;speechState.paused=true;window.speechSynthesis.cancel();document.getElementById('audioStatus').textContent='Paused after sentence '+(speechState.index+1)}function readResume(){if(!speechState.paused)return;speechState.paused=false;speechState.playing=true;window.speechSynthesis.cancel();playSentence(speechState.token)}function showTrans(id){let e=document.getElementById('tr'+id),b=document.getElementById('btn'+id);e.classList.toggle('hidden');b.dataset.shown=e.classList.contains('hidden')?'0':'1';b.textContent=I[lang][e.classList.contains('hidden')?4:5]}function checkText(id,correct){let el=document.getElementById(id),val=el.value.trim().toLowerCase().replace(/[’]/g,"'").replace(/[.!?]/g,'');let answers=correct.toLowerCase().split('|').map(x=>x.trim());let good=answers.includes(val);let f=document.getElementById('fb'+id);f.className='feedback '+(good?'good':'bad');f.textContent=good?I[lang][2]:I[lang][3]+' '+correct.split('|')[0];state[id]=good;updateProgress()}function option(id,value,correct){let box=document.getElementById('q'+id);box.querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',b.dataset.v===value));box.dataset.selected=value}function checkChoice(id,correct){let box=document.getElementById('q'+id),val=box.dataset.selected||'',good=val===correct,f=document.getElementById('fb'+id);f.className='feedback '+(good?'good':'bad');f.textContent=good?I[lang][2]:I[lang][3]+' '+correct;state[id]=good;updateProgress()}function updateProgress(){let total=document.querySelectorAll('.check').length,done=Object.keys(state).length;document.getElementById('progress').style.width=Math.round(done/total*100)+'%';document.getElementById('count').textContent=done+' / '+total+' checked • '+Object.values(state).filter(Boolean).length+' correct'}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function choiceQ(id,text,answers,correct){let opts=shuffle(answers.slice());return '<div class="q" id="q'+id+'"><strong>'+esc(text)+'</strong><div class="opts">'+opts.map(x=>'<button class="opt" data-v="'+esc(x)+'" onclick="option(\''+id+'\',this.dataset.v,\''+esc(correct)+'\')">'+esc(x)+'</button>').join('')+'</div><button class="check" onclick="checkChoice(\''+id+'\',\''+esc(correct)+'\')">Check Answer</button><div id="fb'+id+'" class="feedback"></div></div>'}function inputQ(id,text,answer){return '<div class="q"><label>'+esc(text)+'<br><input id="'+id+'" autocomplete="off" placeholder="Type your answer"></label> <button class="check" onclick="checkText(\''+id+'\',\''+answer+'\')">Check Answer</button><div id="fb'+id+'" class="feedback"></div></div>'}function section(title,key,content){return '<section class="card"><h2>'+title+'</h2>'+langbar()+'<p class="muted" data-i="'+key+'">'+directions[key][0]+'</p>'+content+'</section>'}function popupWord(e,w){let d=DATA.dictionary[w.toLowerCase()]||['Traducere contextuală indisponibilă','Контекстный перевод недоступен'];let p=document.getElementById('popup');p.innerHTML='<strong>'+esc(w)+'</strong><br>🇷🇴 '+esc(d[0])+'<br>🇷🇺 '+esc(d[1])+'<div class="bar"><button onclick="speak(\''+esc(w).replace(/'/g,'\\\'')+'\')">🔊 Listen</button><button onclick="document.getElementById(\'popup\').style.display=\'none\'">✕</button></div>';p.style.display='block';p.style.left=Math.max(8,Math.min(innerWidth-335,e.clientX+10))+'px';p.style.top=Math.max(8,Math.min(innerHeight-190,e.clientY+10))+'px'}function render(){let a='';a+=section('🎯 Lesson objectives','warm','<p>I can discuss personal goals, understand a real achievement story, use introductory <b>there</b> and <b>it</b>, and write a formal enquiry email.</p>');a+=section('🗣️ Speaking — Exercises 1–2','warm','<p><b>1.</b> How often do you set goals in your life? Would you describe yourself as an organised person? Do you think about the skills that you need to improve?</p><p><b>2.</b> Interview a classmate about his or her long-term goals. Share the list with the class.</p><div class="note">Examples from the book: read two books; master coding; get a scholarship; start learning Italian; go to a new place; launch a business start-up.</div>');a+=section('📚 Vocabulary Focus — 16 words','vocab','<div class="grid">'+DATA.vocab.map((v,i)=>'<div class="tile"><strong>'+esc(v[0])+'</strong> <small>'+esc(v[1])+'</small><div class="bar"><button onclick="speak(\''+esc(v[0])+'\')">🔊</button><button id="btn'+i+'" class="transBtn" data-shown="0" onclick="showTrans('+i+')">Show translation</button></div><div id="tr'+i+'" class="hidden">🇷🇴 '+esc(v[2])+'<br>🇷🇺 '+esc(v[3])+'</div></div>').join('')+'</div>');let vq=[['imaginary','existing only in the mind'],['construct','build something'],['verify','check that something is correct'],['worthy','deserving respect'],['carriage','a vehicle with four wheels']];a+=section('🎮 Extra Practice 1 — Match meanings','vocab',vq.map((x,i)=>choiceQ('v'+i,x[1],shuffle(DATA.vocab.slice(0,6).map(v=>v[0])).slice(0,3).concat([x[0]]).filter((v,j,ar)=>ar.indexOf(v)===j).slice(0,4),x[0])).join(''));a+=section('🎮 Extra Practice 2 — Word completion','vocab',inputQ('ve1','He wanted to _____ a toy railway.','construct')+inputQ('ve2','She worked hard to achieve her _____.','goal')+inputQ('ve3','The train pulled 101 _____.','carriages')+inputQ('ve4','He had to _____ that the train worked.','verify'));a+=section('🎮 Extra Practice 3 — Vocabulary choices','vocab',choiceQ('vx1','A person who has achieved something important has made an…',['achievement','accident','argument','appointment'],'achievement')+choiceQ('vx2','A railway train travels along a…',['track','street','pathway','runway'],'track')+choiceQ('vx3','Something very beautiful and impressive is…',['magnificent','ordinary','minor','careless'],'magnificent'));
let pw=['creating','goals','yourself','to continue','important','step'];a+=section('📖 Reading — Exercise 3: ONE QUESTION (Julie Hebert)','poem','<p><b>Word Bank:</b> '+pw.map(x=>'<span class="tag">'+x+'</span>').join(' ')+'</p><div class="poem">'+esc(DATA.poem)+'</div>'+['important','goals','to continue','creating','yourself','step'].map((x,i)=>inputQ('p'+i,'Gap '+(i+1),x)).join('')+'<p><b>Discuss:</b> How do you understand the poem? What are your favourite lines? Draw a mind map to explain its message.</p>');let marked=new Set(['viewing','series','lengthy','individuals','magnificent']);let rd=DATA.reading.replace(/([A-Za-z]+(?:[-’'][A-Za-z]+)*|\d+)/g,(w)=>'<span class="word" '+(marked.has(w.toLowerCase())?'style="background:#fff1a8"':'')+' onclick="popupWord(event,\''+w.replace(/'/g,"\\'")+'\')">'+w+'</span>');a+=section('📖 Reading — Exercise 4: THE WORLD’S LONGEST LEGO TRAIN','read','<p><b>Think:</b> Why is Alexander Blong a hero? What is his major life achievement?</p><div class="bar"><button onclick="readStart()">▶ Listen</button><button onclick="readPause()">⏸ Pause</button><button onclick="readResume()">⏯ Resume</button><button onclick="stopAudio()">⏹ Stop</button><span class="muted" id="audioStatus">Ready</span></div><div class="reading">'+rd+'</div><p class="source">Reading text reproduced from the uploaded textbook pages 25–26.</p>');a+=section('🔎 Exercise 5 — Highlighted words','ex5',DATA.questions.ex5.map((x,i)=>inputQ('e5'+i,(i+1)+'. '+x[0],x[1])).join(''));a+=section('✔ Exercise 6 — True / False','ex6',DATA.questions.ex6.map((x,i)=>choiceQ('e6'+i,(i+1)+'. '+x[0],['True','False'],x[1])).join(''));a+=section('🔍 Exercise 7 — Synonyms from the text','ex7',DATA.questions.ex7.map((x,i)=>inputQ('e7'+i,x[0],x[1])).join(''));a+=section('📘 Grammar — Introductory THERE and IT','ex8','<div class="grid"><div class="tile"><h3>Introductory THERE</h3><p>Use <b>there is / there are</b> to introduce the existence or number of people and things.</p><p><b>There’s</b> an interesting article. <b>There are</b> twenty students.</p><p>🇷🇴 <b>Există / Este / Sunt</b> — introducem existența unui lucru.</p><p>🇷🇺 <b>Есть / имеется</b> — сообщаем о наличии предмета.</p></div><div class="tile"><h3>Introductory IT</h3><p>Use <b>it</b> for time, dates, weather, and with <b>be + -ing / to-infinitive</b>.</p><p><b>It’s</b> ten o’clock. <b>It’s</b> snowing. <b>It’s</b> nice to meet you.</p><p>🇷🇴 <b>It</b> se folosește pentru timp, vreme și expresii impersonale.</p><p>🇷🇺 <b>It</b> используется для времени, погоды и безличных конструкций.</p></div></div>');a+=section('🧩 Exercise 8 — Choose the correct answer','ex8',DATA.questions.ex8.map((x,i)=>choiceQ('e8'+i,(i+1)+'. '+x[0],["It’s","There’s"],x[1])).join(''));a+=section('✏️ Exercise 9 — Fill in the gaps','ex9',DATA.questions.ex9.map((x,i)=>inputQ('e9'+i,(i+1)+'. '+x[0],x[1])).join(''));a+=section('🎧 Exercise 10 — Listening','read','<div class="note">The textbook asks you to listen to a conversation about personal development activities and tick the correct pictures (reading, dancing, gardening, and other activities). <b>The original listening audio was not included in the uploaded pages.</b> Use the recording supplied by your teacher; no invented audio or answer key is provided.</div>');a+=section('🔊 Pronunciation Challenge','pron','<div class="grid">'+['imaginary','construct','aware','verify','worthy','carriage','lengthy','magnificent'].map((w,i)=>{let d=DATA.dictionary[w]||['—','—'];return '<div class="tile"><b>'+w+'</b><div class="bar"><button onclick="speak(\''+w+'\')">🔊 Listen</button><button class="transBtn" data-shown="0" id="btnp'+i+'" onclick="showTrans(\'p'+i+'\')">Show translation</button></div><div id="trp'+i+'" class="hidden">🇷🇴 '+d[0]+'<br>🇷🇺 '+d[1]+'</div></div>'}).join('')+'</div>');a+=section('✉️ Exercise 11 — Writing a formal email','writing','<p>Write to a cultural youth centre. Explain <b>what you are interested in</b>, <b>why you are interested</b>, and <b>what questions you have</b>. Begin with <b>Dear Sir / Madam,</b> and finish with <b>Best regards,</b>.</p><textarea id="writing" oninput="document.getElementById(\'wc\').textContent=this.value.trim()?this.value.trim().split(/\\s+/).length:0" placeholder="Dear Sir / Madam,\nI am writing to express my interest in ..."></textarea><p>Word count: <b id="wc">0</b></p><button onclick="document.getElementById(\'model\').classList.toggle(\'hidden\')">Show / hide model</button><div id="model" class="note hidden"><b>Model:</b><p>Dear Sir / Madam,<br>I am writing to express my interest in the activities organised at your cultural youth centre. I am particularly interested in coding and creative writing because I want to improve my skills and meet new people.<br>Could you please tell me when the classes take place and whether beginners can join? I would also like to know if there is a registration fee.<br>I look forward to hearing from you.<br>Best regards,<br>Alex</p></div>');a+=section('🏁 Final Challenge — 6 questions','vocab',choiceQ('f1','Alexander Blong created a LEGO train with…',['69 carriages','101 carriages','50 carriages','14 carriages'],'101 carriages')+choiceQ('f2','Which phrase introduces something that exists?',["It’s late","There is a book","It’s raining","It’s easy"],'There is a book')+choiceQ('f3','Choose the correct sentence.',['There is two goals.','It are two goals.','There are two goals.','There two goals.'],'There are two goals.')+choiceQ('f4','Which verb means “check that something is correct”?',['verify','create','view','travel'],'verify')+choiceQ('f5','Which is suitable for a formal enquiry email?',['Hey, tell me now!','Could you please send me details?','Give me the schedule!','What’s up?'],'Could you please send me details?')+choiceQ('f6','What did Alexander need for his long train?',['A longer track','A smaller carriage','A shorter train','A different toy'],'A longer track'));document.getElementById('app').innerHTML=a;setLang('EN');updateProgress()}render();
function enhancedLesson(){
 const app=document.getElementById('app');
 const cards=[...app.querySelectorAll('section.card')];
 const by=(q)=>cards.find(x=>x.querySelector('h2')?.textContent.includes(q));
 const goals=by('Lesson objectives'), speaking=by('Speaking — Exercises 1–2'), vocab=by('Vocabulary Focus');
 if(goals){
   goals.querySelector('h2').textContent='🎯 Three Lesson Goals';
   goals.querySelector('p:not(.muted)').innerHTML='<b>I can…</b><br>① talk about my personal goals and achievements.<br>② understand a story about a young achiever and use new vocabulary.<br>③ distinguish <b>There is / There are</b> from <b>It is</b> and write a formal enquiry email.';
 }
 const warm=document.createElement('section');
 warm.className='card';
 warm.innerHTML='<h2>⚡ Warm-up — Tongue Twister</h2><p class="note" style="font-size:22px">🎤 <b>Great goals grow with grit!</b></p><div class="bar"><button onclick="speak(\'Great goals grow with grit!\')">🔊 Listen</button><button onclick="this.nextElementSibling.classList.toggle(\'hidden\')">💡 Show / Hide tip</button><span class="hidden">Say it slowly, then three times faster. What does <b>grit</b> mean? Determination!</span></div>';
 if(goals)goals.after(warm);
 if(vocab){
   const controls=document.createElement('div');
   controls.className='bar';
   controls.innerHTML='<button id="allTranslations" onclick="toggleAllTranslations()">👁 Reveal All Translations</button><span class="muted">🇷🇴 + 🇷🇺 • all words at once</span>';
   vocab.querySelector('h2').after(controls);
 }
 // Make the original Exercise 1 interactive, with guided speaking and hidden models.
 if(speaking){
  const d=document.createElement('div');
  d.innerHTML='<div class="grid"><div class="tile"><b>Exercise 1 — My goals</b><p>Choose your answer and explain why.</p><label>How often do you set goals? <select><option value="">Choose…</option><option>Every week</option><option>Every month</option><option>Sometimes</option></select></label><p>What skill would you like to improve?</p><input placeholder="I want to improve…" style="width:100%"></div><div class="tile"><b>Exercise 2 — Interview a partner</b><p>Ask: What is your biggest goal? When will you achieve it? What will you do first?</p><textarea placeholder="My partner wants to…"></textarea></div></div><button onclick="this.nextElementSibling.classList.toggle(\'hidden\')">💡 Show / Hide model</button><div class="note hidden">I set goals every month. My biggest goal is to improve my English. I will practise for fifteen minutes every day. My partner wants to learn coding.</div>';
  speaking.append(d);
 }
 // Add a global reset and per-exercise retry at the end of each exercise.
 const reset=document.createElement('div');reset.className='bar';
 reset.innerHTML='<button style="background:#a23d55" onclick="if(confirm(\'Clear all answers and start a new class?\')){stopAudio();render();enhancedLesson()}">🔄 Start a new class / Reset all</button>';
 app.prepend(reset);
 [...app.querySelectorAll('section.card')].forEach((sec,i)=>{
   if(sec===goals||sec===warm||sec===vocab)return;
   if(sec.querySelectorAll('.q, input, textarea, select, .opt').length===0)return;
   const b=document.createElement('button');b.textContent='↻ Retry this exercise';b.className='retry-section';
   b.onclick=()=>{
    sec.querySelectorAll('input,textarea').forEach(x=>{x.value='';x.dispatchEvent(new Event('input'))});
    sec.querySelectorAll('select').forEach(x=>x.selectedIndex=0);
    sec.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
    sec.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});
    sec.querySelectorAll('[data-shown]').forEach(x=>{x.dataset.shown='0'});
    updateProgress();
   };
   sec.append(b);
 });
 // Visible language-specific vocabulary games; use the already existing original vocabulary items.
 const vg=document.createElement('section');vg.className='card';
 vg.innerHTML='<h2>🎮 Vocabulary Game 3 — Translation Race (RO / RU)</h2><div class="bar"><button onclick="translationRace(\'RO\')">🇷🇴 Romanian</button><button onclick="translationRace(\'RU\')">🇷🇺 Русский</button></div><p class="muted">Read the translation and choose the English word. Switch languages at any moment.</p><div id="raceItems"></div><button onclick="translationRace(window.raceLang||\'RO\')">↻ Retry this game</button>';
 const game2=by('Extra Practice 3');
 if(game2)game2.after(vg);else if(vocab)vocab.after(vg);
 translationRace('RO');
 // Grammar is introduced immediately before exercise 8 and includes optional detailed translations.
 const grammar=by('Grammar —');
 if(grammar){
  const div=document.createElement('div');
  div.innerHTML='<div class="bar"><button onclick="document.getElementById(\'grammarRO\').classList.toggle(\'hidden\')">🇷🇴 Explicație</button><button onclick="document.getElementById(\'grammarRU\').classList.toggle(\'hidden\')">🇷🇺 Объяснение</button></div><div id="grammarRO" class="note hidden"><b>THERE IS / ARE</b> = există / se află (prezentăm ceva): There is a book. There are two books.<br><b>IT IS</b> = pentru oră, vreme, dată, evaluări: It is cold. It is 8 o’clock. It is easy.</div><div id="grammarRU" class="note hidden"><b>THERE IS / ARE</b> = есть / находится (сообщаем о наличии): There is a book. There are two books.<br><b>IT IS</b> = время, погода, дата, оценка: It is cold. It is 8 o’clock. It is easy.</div>';
  grammar.append(div);
 }
 // Improve writing scaffold, keeping the textbook task.
 const writing=by('Exercise 11');
 if(writing){
  const guide=document.createElement('div');
  guide.className='note';
  guide.innerHTML='<b>✍️ Writing mission — 80–110 words</b><p>Write a polite email to a youth centre. Use 3 short paragraphs: <b>(1)</b> which activity interests you, <b>(2)</b> why you want to join, <b>(3)</b> two questions about the schedule, price or registration.</p><b>Useful phrases:</b> I am writing to enquire about… · I am interested in… · I would like to know whether… · Could you please tell me… · I look forward to hearing from you.<br><b>Checklist:</b> ☐ greeting ☐ three paragraphs ☐ two questions ☐ polite closing ☐ spelling';
  const ta=writing.querySelector('textarea');if(ta)ta.before(guide);
 }
}
function toggleAllTranslations(){
 const vocab=[...document.querySelectorAll('section.card')].find(x=>x.querySelector('h2')?.textContent.includes('Vocabulary Focus'));
 if(!vocab)return;
 const items=[...vocab.querySelectorAll('[id^="tr"]')];
 const reveal=items.some(x=>x.classList.contains('hidden'));
 items.forEach(x=>x.classList.toggle('hidden',!reveal));
 vocab.querySelectorAll('.transBtn').forEach(b=>b.dataset.shown=reveal?'1':'0');
 document.getElementById('allTranslations').textContent=reveal?'🙈 Hide All Translations':'👁 Reveal All Translations';
}
function translationRace(lang){
 window.raceLang=lang;
 const box=document.getElementById('raceItems');if(!box)return;
 const terms=DATA.vocab.slice(0,8);
 box.innerHTML=terms.map((v,i)=>{
  const choices=[v[0],DATA.vocab[(i+3)%DATA.vocab.length][0],DATA.vocab[(i+6)%DATA.vocab.length][0]].filter((x,j,a)=>a.indexOf(x)===j);
  return '<div class="q"><b>'+(i+1)+'. '+(lang==='RO'?'🇷🇴 ':'🇷🇺 ')+esc(v[lang==='RO'?2:3])+'</b><div class="opts">'+choices.map(w=>'<button class="opt" onclick="this.parentNode.querySelectorAll(\'.opt\').forEach(b=>b.classList.remove(\'selected\'));this.classList.add(\'selected\')">'+esc(w)+'</button>').join('')+'</div><button onclick="let p=this.parentNode,v=p.querySelector(\'.opt.selected\');p.querySelector(\'.feedback\').textContent=!v?\'Choose an answer first\':v.textContent==='+JSON.stringify(v[0])+'?\'✓ Correct!\':\'✗ Correct answer: '+esc(v[0])+'\'">Check Answer</button><div class="feedback"></div></div>';
 }).join('');
}
enhancedLesson();
</script></body></html>
