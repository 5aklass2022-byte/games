<head>

<title>My English Games</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5ff;
  margin: 0;
  padding: 24px;
  color: #23345d;
}
main {max-width: 900px; margin: auto}
h1 {text-align: center}
.subtitle {text-align: center}
details {
  background: white;
  border-radius: 16px;
  margin: 16px 0;
  padding: 18px;
  box-shadow: 0 3px 12px #0001;

summary {
  cursor: pointer;
  font-size: 23px;
  font-weight: bold;
}
.game {
  display: block;
  padding: 14px;
  margin-top: 12px;
  background: #edf3ff;
  border-radius: 10px;
  color: #2346a0;
  text-decoration: none;
}
.game:hover {background: #dbe7ff}
</style>
</head>
<body>
<main>
